[build]
  command = "npm run build"
  publish = "dist"

# 1. Исключаем sw.js из общего редиректа
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

# 2. Исключаем workbox из общего редиректа
[[redirects]]
  from = "/workbox-*.js"
  to = "/workbox-*.js"
  status = 200

# 3. Исключаем манифест PWA
[[redirects]]
  from = "/manifest.webmanifest"
  to = "/manifest.webmanifest"
  status = 200

# 4. Все остальные пути отдают index.html для работы React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
